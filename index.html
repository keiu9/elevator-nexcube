<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#252827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="エレベーター" />
    <title>NEXCUBE — エレベーター体験</title>
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <main class="experience">
      <h1 class="sr-only">エレベーター操作盤</h1>
      <section class="control-panel" aria-label="エレベーター操作盤">
        <div class="panel-top">
          <span>NEXCUBE</span><span class="speaker" aria-hidden="true"></span>
        </div>
        <div class="panel-screen">
          <div class="indicator">
            <span class="direction" data-direction aria-hidden="true">▲</span
            ><span
              class="floor-digits"
              data-display
              aria-label="現在階 1階"
            ></span>
          </div>
          <div class="screen-message" id="screenMessage">
            ドアが開いています
          </div>
        </div>
        <div
          class="floor-btn-grid"
          id="floorGrid"
          aria-label="行先階ボタン"
        ></div>
        <div class="door-controls">
          <button
            class="door-button open-button"
            id="openButton"
            type="button"
            aria-label="ドアを開く"
          >
            <svg viewBox="0 0 48 28" aria-hidden="true">
              <path d="M20 3 7 14l13 11M28 3l13 11-13 11M24 2v24" /></svg
            ><span>開</span>
          </button>
          <button
            class="door-button close-button"
            id="closeButton"
            type="button"
            aria-label="ドアを閉じる"
          >
            <svg viewBox="0 0 48 28" aria-hidden="true">
              <path d="m5 3 13 11L5 25M43 3 30 14l13 11M24 2v24" /></svg
            ><span>閉</span>
          </button>
        </div>
        <div class="panel-bottom">
          <div class="intercom-row">
            <span>非常呼出<small>INTERCOM</small></span
            ><button
              class="call-button"
              id="callButton"
              type="button"
              aria-label="非常呼出の体験"
              aria-pressed="false"
            >
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path
                  d="M11 5 6 8c-2 7 11 20 18 18l3-5-7-4-3 3c-3-1-4-3-5-5l3-3Z"
                />
              </svg>
            </button>
          </div>
          <div class="panel-tools">
            <button
              id="soundButton"
              class="tool-button"
              type="button"
              aria-pressed="true"
              aria-label="音声を切り替える"
            >
              音声 ON
            </button>
            <button id="resetButton" class="tool-button" type="button">
              最初から
            </button>
          </div>
        </div>
        <div
          class="announcement sr-only"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          <span id="announcement">行先階のボタンを押してください</span>
        </div>
        <div class="panel-brand">
          <span class="diamonds" aria-hidden="true">◆</span
          ><span>MITSUBISHI ELECTRIC</span>
        </div>

        <div class="panel-screw" aria-hidden="true"></div>
      </section>
    </main>
    <script src="elevator.js?v=3"></script>
    <script src="audio.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
