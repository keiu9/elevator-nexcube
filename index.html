<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEXCUBE">
  <title>三菱電機エレベーター 200階</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="simulator">

    <!-- 左：シャフト断面図 -->
    <div class="shaft-view">
      <div class="shaft-label">昇降路断面図</div>
      <div class="shaft" id="shaft">
        <div class="floor-scale" id="floorScale"></div>
        <div class="car" id="car">
          <div class="door left"></div>
          <div class="door right"></div>
          <div class="cab-ceiling-line"></div>
        </div>
      </div>
      <div class="shaft-info">
        <div class="info-cell"><span>現在階</span><strong id="currentFloor">1</strong></div>
        <div class="info-cell"><span>目的階</span><strong id="targetFloor">---</strong></div>
        <div class="info-cell"><span>状態</span><strong id="speedLabel">停止</strong></div>
        <div class="info-cell"><span>ドア</span><strong id="doorLabel">開</strong></div>
      </div>
      <div class="queue-display">予約: <span id="queueLabel">なし</span></div>
    </div>

    <!-- 右：三菱エレベーター操作盤 COP -->
    <div class="cop-wrap">
      <div class="cop" role="region" aria-label="エレベーター操作盤">

        <!-- モデルプレート -->
        <div class="model-plate">
          <span class="model-name">NEXCUBE</span>
          <span class="model-sub">ORDER MADE ELEVATOR</span>
        </div>

        <!-- 位置表示器 -->
        <div class="position-indicator" aria-label="位置表示器">
          <div class="dir-col">
            <div class="dir-arrow up" id="arrowUp">▲</div>
            <div class="dir-arrow down" id="arrowDown">▼</div>
          </div>
          <div class="seg-display" id="floorDisplay" aria-live="polite" aria-label="現在階表示">1</div>
        </div>

        <!-- 階数ボタンエリア -->
        <div class="floor-btn-grid" id="floorGrid" aria-label="階数選択ボタン"></div>

        <!-- サービスボタン -->
        <div class="service-row">
          <button class="svc-btn open-btn" data-service="open" aria-label="ドアを開く">
            <svg class="door-icon" viewBox="0 0 32 20" width="28" height="18" aria-hidden="true">
              <path d="M14 2 L2 10 L14 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path d="M18 2 L30 10 L18 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </svg>
            <span>開く</span>
          </button>
          <button class="svc-btn close-btn" data-service="close" aria-label="ドアを閉じる">
            <svg class="door-icon" viewBox="0 0 32 20" width="28" height="18" aria-hidden="true">
              <path d="M4 2 L16 10 L4 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path d="M28 2 L16 10 L28 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </svg>
            <span>閉める</span>
          </button>
          <button class="svc-btn cancel-btn" data-service="cancel" aria-label="取消">
            <span>取消</span>
          </button>
          <button class="svc-btn emg-btn" data-service="bell" aria-label="非常ボタン">
            <span>非常</span>
          </button>
        </div>

        <!-- 定員・積載量プレート -->
        <div class="capacity-plate">
          <div class="cap-row">
            <span class="cap-label">定員</span>
            <span class="cap-val">24名</span>
            <span class="cap-label">積載量</span>
            <span class="cap-val">1,600kg</span>
          </div>
        </div>

        <!-- 三菱ロゴ・ブランド -->
        <div class="brand-footer">
          <svg class="mitsubishi-mark" viewBox="0 0 64 56" width="26" height="23" aria-label="三菱マーク">
            <polygon points="32,1 42,19 22,19" fill="#d91f26"/>
            <polygon points="13,23 23,41 3,41" fill="#d91f26"/>
            <polygon points="51,23 61,41 41,41" fill="#d91f26"/>
          </svg>
          <span class="brand-name">MITSUBISHI ELECTRIC</span>
        </div>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
